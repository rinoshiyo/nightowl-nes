<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 20" width="128" height="128" shape-rendering="crispEdges">
  <!-- 18x20 pixel-art owl (trimmed from 32x32, origin shifted) -->
  <!-- Ear tufts -->
  <rect x="1" y="1" width="2" height="3" fill="#D97757"/>
  <rect x="15" y="1" width="2" height="3" fill="#D97757"/>
  <!-- Head top -->
  <rect x="3" y="3" width="12" height="2" fill="#D97757"/>
  <rect x="1" y="5" width="16" height="2" fill="#D97757"/>
  <!-- Face -->
  <rect x="1" y="7" width="16" height="4" fill="#D97757"/>
  <!-- Left eye -->
  <rect x="2" y="7" width="5" height="4" fill="#222"/>
  <rect x="4" y="8" width="2" height="2" fill="#f0f0f5"/>
  <!-- Right eye -->
  <rect x="11" y="7" width="5" height="4" fill="#222"/>
  <rect x="13" y="8" width="2" height="2" fill="#f0f0f5"/>
  <!-- Beak -->
  <rect x="8" y="10" width="2" height="1" fill="#E8956F"/>
  <!-- Upper body -->
  <rect x="3" y="11" width="12" height="2" fill="#D97757"/>
  <!-- Belly -->
  <rect x="3" y="13" width="12" height="4" fill="#b8603f"/>
  <!-- Belly pattern -->
  <rect x="5" y="13" width="2" height="2" fill="#D97757"/>
  <rect x="8" y="13" width="2" height="2" fill="#D97757"/>
  <rect x="11" y="13" width="2" height="2" fill="#D97757"/>
  <rect x="6" y="15" width="2" height="2" fill="#D97757"/>
  <rect x="10" y="15" width="2" height="2" fill="#D97757"/>
  <!-- Feet -->
  <rect x="4" y="17" width="3" height="2" fill="#E8956F"/>
  <rect x="11" y="17" width="3" height="2" fill="#E8956F"/>
</svg>
