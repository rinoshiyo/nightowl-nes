name: nightly

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      # NOTE: .github/workflows/nightly.yml 自身は paths から除外。
      #       workflow 編集だけで発火 → src/tests 空のまま typecheck 落ち、
      #       のループを防ぐため
  pull_request:
    branches: [main]
    # PR は全パスで発火 (夜N PR は src/ tests/ を必ず触る前提)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint "src/**/*.ts" "tests/**/*.ts" || true

      - name: Test
        run: bun test

      - name: Upload coverage (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
